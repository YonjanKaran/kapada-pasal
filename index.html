{filtered.length === 0 && (
  <div style={{ gridColumn: "1/-1", textAlign: "center", padding: 60, color: "#94a3b8" }}>
    <div style={{ fontSize: 48, marginBottom: 12 }}>🔍</div>
    <div style={{ fontSize: 16, fontWeight: 600 }}>No products found</div>
    <button
      onClick={() => {
        setSearch("");
        setCategory("All");
      }}
      style={{
        marginTop: 16,
        padding: "8px 20px",
        borderRadius: 20,
        border: "1.5px solid #e07b54",
        background: "none",
        color: "#e07b54",
        cursor: "pointer",
        fontWeight: 700
      }}
    >
      Reset Filters
    </button>
  </div>
)}

{filtered.map(product => (
  <ProductCard
    key={product.id}
    product={product}
    onAddToCart={addToCart}
    onView={setViewProduct}
  />
))}
</div>

{/* Modals */}
{cartOpen && (
  <CartDrawer
    cart={cart}
    onClose={() => setCartOpen(false)}
    onRemove={removeFromCart}
    onQtyChange={changeQty}
  />
)}

{viewProduct && (
  <ProductModal
    product={viewProduct}
    onClose={() => setViewProduct(null)}
    onAddToCart={addToCart}
  />
)}
</div>
);
}
