<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapada Pasal — Luxury Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #0c0b09;
  --cream: #f7f3ee;
  --warm: #ede8e1;
  --gold: #b89a6a;
  --gold-light: #d4b88a;
  --gold-pale: #f0e6d3;
  --muted: #8a8279;
  --white: #ffffff;
  --shadow: 0 25px 60px rgba(12,11,9,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Jost', sans-serif;
  background: var(--cream);
  color: var(--ink);
  overflow-x: hidden;
  cursor: none;
}

/* ─── CUSTOM CURSOR ─── */
#cursor {
  width: 10px; height: 10px;
  background: var(--gold);
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform 0.1s, width 0.3s, height 0.3s, background 0.3s;
}
#cursor-ring {
  width: 36px; height: 36px;
  border: 1px solid var(--gold);
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%,-50%);
  transition: transform 0.18s ease, width 0.3s, height 0.3s, opacity 0.3s;
  opacity: 0.6;
}
body:hover #cursor { opacity: 1; }
a:hover ~ #cursor, button:hover ~ #cursor { width: 18px; height: 18px; }

/* ─── NAV ─── */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 48px;
  z-index: 1000;
  transition: background 0.5s, box-shadow 0.5s, padding 0.4s;
}
nav.scrolled {
  background: rgba(247,243,238,0.96);
  backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 rgba(184,154,106,0.2);
  padding: 14px 48px;
}
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 300;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.logo span { color: var(--gold); }
.nav-right { display: flex; align-items: center; gap: 32px; }
.nav-links { display: flex; gap: 28px; list-style: none; }
.nav-links a {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--ink);
  font-weight: 400;
  position: relative;
  padding-bottom: 2px;
}
.nav-links a::after {
  content: '';
  position: absolute;
  left: 0; bottom: 0;
  width: 0; height: 1px;
  background: var(--gold);
  transition: width 0.3s;
}
.nav-links a:hover::after { width: 100%; }
.cart-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: none;
  border: none;
  font-family: 'Jost', sans-serif;
  color: var(--ink);
  padding: 8px 16px;
  border: 1px solid transparent;
  transition: border-color 0.3s;
}
.cart-trigger:hover { border-color: var(--gold); }
.cart-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px; height: 18px;
  background: var(--gold);
  color: white;
  border-radius: 50%;
  font-size: 9px;
  font-weight: 500;
}

/* ─── HERO ─── */
.hero {
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  position: relative;
  overflow: hidden;
}
.hero-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 80px 0 80px;
  position: relative;
  z-index: 2;
}
.hero-eyebrow {
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 400;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeUp 0.9s 0.3s forwards;
}
.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(52px, 6vw, 88px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 0.9s 0.5s forwards;
}
.hero h1 em {
  font-style: italic;
  color: var(--gold);
}
.hero-sub {
  font-size: 13px;
  font-weight: 300;
  color: var(--muted);
  line-height: 1.8;
  max-width: 360px;
  margin-bottom: 44px;
  letter-spacing: 0.03em;
  opacity: 0;
  animation: fadeUp 0.9s 0.7s forwards;
}
.hero-actions {
  display: flex;
  gap: 16px;
  opacity: 0;
  animation: fadeUp 0.9s 0.9s forwards;
}
.btn-primary {
  padding: 14px 36px;
  background: var(--ink);
  color: var(--cream);
  border: none;
  font-family: 'Jost', sans-serif;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
}
.btn-primary:hover { background: var(--gold); transform: translateY(-1px); }
.btn-outline {
  padding: 14px 36px;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--ink);
  font-family: 'Jost', sans-serif;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.3s, color 0.3s, transform 0.2s;
}
.btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }

.hero-visual {
  position: relative;
  overflow: hidden;
  background: var(--warm);
}
.hero-visual::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--gold-pale) 0%, var(--warm) 60%);
  z-index: 0;
}
.hero-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.55;
  mix-blend-mode: multiply;
  transform: scale(1.05);
  animation: heroZoom 8s ease forwards;
}
@keyframes heroZoom { to { transform: scale(1); } }
.hero-badge {
  position: absolute;
  bottom: 48px;
  left: 40px;
  z-index: 2;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  animation: rotate 12s linear infinite;
}
.hero-badge-text {
  position: absolute;
  font-size: 7.5px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  width: 100%;
  height: 100%;
  animation: rotate 12s linear infinite reverse;
}
.hero-badge svg {
  width: 100%;
  height: 100%;
  position: absolute;
}
@keyframes rotate { to { transform: rotate(360deg); } }
.hero-scroll {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: fadeIn 1s 1.5s forwards;
}
.hero-scroll span {
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
}
.scroll-line {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, var(--gold), transparent);
  animation: scrollPulse 2s ease infinite;
}
@keyframes scrollPulse {
  0%,100% { opacity: 0.4; transform: scaleY(1); }
  50% { opacity: 1; transform: scaleY(1.2); }
}
.hero-decor {
  position: absolute;
  bottom: 30px;
  right: 30px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 120px;
  font-weight: 300;
  color: rgba(184,154,106,0.08);
  line-height: 1;
  z-index: 1;
  pointer-events: none;
}

/* ─── MARQUEE ─── */
.marquee-wrap {
  background: var(--ink);
  padding: 14px 0;
  overflow: hidden;
  position: relative;
}
.marquee-track {
  display: flex;
  gap: 0;
  animation: marquee 20s linear infinite;
  white-space: nowrap;
}
.marquee-item {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 32px;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 300;
}
.marquee-dot { color: var(--gold-light); }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ─── FILTERS ─── */
.products-section { padding: 100px 80px; }
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 56px;
}
.section-label {
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}
.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 300;
  line-height: 1.1;
}
.section-title em { font-style: italic; color: var(--gold); }
.filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.filter-btn {
  padding: 8px 20px;
  border: 1px solid rgba(184,154,106,0.3);
  background: transparent;
  color: var(--muted);
  font-family: 'Jost', sans-serif;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}
.filter-btn:hover { border-color: var(--gold); color: var(--gold); }
.filter-btn.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
}

/* ─── PRODUCT GRID ─── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 32px;
}
.card {
  background: var(--white);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s;
  opacity: 0;
  transform: translateY(24px);
  animation: fadeUp 0.7s forwards;
}
.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.15s; }
.card:nth-child(3) { animation-delay: 0.25s; }
.card:nth-child(4) { animation-delay: 0.35s; }
.card:nth-child(5) { animation-delay: 0.45s; }
.card:nth-child(6) { animation-delay: 0.55s; }
.card.hidden { display: none; }
.card:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
.card-img-wrap {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: var(--warm);
}
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.card:hover .card-img-wrap img { transform: scale(1.06); }
.card-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  background: var(--gold);
  color: white;
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 4px 10px;
  font-weight: 500;
}
.card-overlay {
  position: absolute;
  inset: 0;
  background: rgba(12,11,9,0.45);
  opacity: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s;
  gap: 12px;
}
.card:hover .card-overlay { opacity: 1; }
.overlay-btn {
  padding: 10px 22px;
  background: var(--cream);
  color: var(--ink);
  border: none;
  font-family: 'Jost', sans-serif;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
  transform: translateY(8px);
  transition: transform 0.4s, background 0.3s, color 0.3s;
}
.card:hover .overlay-btn { transform: translateY(0); }
.overlay-btn.gold { background: var(--gold); color: white; transition-delay: 0.05s; }
.overlay-btn:hover { background: var(--ink); color: var(--cream); }
.overlay-btn.gold:hover { background: var(--gold-light); }
.card-info { padding: 20px 20px 24px; }
.card-category {
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}
.card-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-price {
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 0.05em;
}
.card-price span { color: var(--gold); font-weight: 500; }
.card-rating {
  display: flex;
  gap: 2px;
}
.star { color: var(--gold); font-size: 10px; }

/* ─── PRODUCT MODAL ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(12,11,9,0.75);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--cream);
  max-width: 840px;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  position: relative;
  transform: translateY(30px) scale(0.97);
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  max-height: 90vh;
  overflow: hidden;
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-img {
  background: var(--warm);
  aspect-ratio: auto;
  position: relative;
  overflow: hidden;
}
.modal-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  background: var(--ink);
  color: var(--cream);
  border: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: background 0.3s;
}
.modal-close:hover { background: var(--gold); }
.modal-content {
  padding: 48px 40px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.modal-cat {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}
.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 300;
  margin-bottom: 8px;
  line-height: 1.1;
}
.modal-price {
  font-size: 22px;
  font-weight: 300;
  color: var(--gold);
  margin-bottom: 24px;
  letter-spacing: 0.05em;
}
.modal-divider {
  width: 40px;
  height: 1px;
  background: var(--gold);
  margin-bottom: 20px;
}
.modal-desc {
  font-size: 13px;
  font-weight: 300;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 28px;
  letter-spacing: 0.02em;
}
.size-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 12px;
  color: var(--ink);
}
.size-options {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.size-btn {
  width: 44px;
  height: 44px;
  border: 1px solid rgba(184,154,106,0.3);
  background: transparent;
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--ink);
}
.size-btn:hover, .size-btn.selected {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--cream);
}
.modal-actions { display: flex; gap: 10px; margin-top: auto; }
.modal-actions .btn-primary { flex: 1; }

/* ─── CART DRAWER ─── */
.cart-drawer {
  position: fixed;
  right: -440px;
  top: 0;
  width: 400px;
  height: 100%;
  background: var(--cream);
  box-shadow: -20px 0 60px rgba(12,11,9,0.15);
  z-index: 3000;
  display: flex;
  flex-direction: column;
  transition: right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.cart-drawer.open { right: 0; }
.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 32px;
  border-bottom: 1px solid rgba(184,154,106,0.2);
}
.cart-header h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 300;
  letter-spacing: 0.05em;
}
.cart-close {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 22px;
  color: var(--ink);
  transition: color 0.2s;
  line-height: 1;
}
.cart-close:hover { color: var(--gold); }
.cart-body { flex: 1; overflow-y: auto; padding: 24px 32px; }
.cart-empty {
  text-align: center;
  padding: 60px 0;
  color: var(--muted);
}
.cart-empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.cart-empty p { font-size: 13px; letter-spacing: 0.05em; }
.cart-item {
  display: flex;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid rgba(184,154,106,0.12);
  animation: fadeUp 0.4s forwards;
}
.cart-item-img {
  width: 72px;
  height: 88px;
  object-fit: cover;
  background: var(--warm);
  flex-shrink: 0;
}
.cart-item-details { flex: 1; }
.cart-item-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 400;
  margin-bottom: 4px;
}
.cart-item-size {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.cart-item-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.qty-ctrl {
  display: flex;
  align-items: center;
  gap: 12px;
}
.qty-btn {
  width: 26px;
  height: 26px;
  border: 1px solid rgba(184,154,106,0.3);
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: var(--ink);
}
.qty-btn:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.qty-num { font-size: 13px; font-weight: 300; min-width: 20px; text-align: center; }
.cart-item-price { font-size: 14px; font-weight: 300; color: var(--gold); }
.cart-remove {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  transition: color 0.2s;
}
.cart-remove:hover { color: #c0392b; }
.cart-footer {
  padding: 24px 32px;
  border-top: 1px solid rgba(184,154,106,0.2);
}
.cart-total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.cart-total-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
}
.cart-total-amount {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 300;
  color: var(--gold);
}
.cart-footer .btn-primary { width: 100%; padding: 16px; font-size: 10px; }

.cart-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(12,11,9,0.4);
  z-index: 2999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.cart-backdrop.open { opacity: 1; pointer-events: all; }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--cream);
  padding: 12px 28px;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  opacity: 0;
  transition: all 0.4s;
  z-index: 5000;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── FEATURES ─── */
.features {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid rgba(184,154,106,0.2);
  border-bottom: 1px solid rgba(184,154,106,0.2);
  margin: 0 80px 100px;
}
.feature {
  padding: 40px 30px;
  text-align: center;
  border-right: 1px solid rgba(184,154,106,0.2);
  transition: background 0.3s;
}
.feature:last-child { border-right: none; }
.feature:hover { background: var(--gold-pale); }
.feature-icon {
  font-size: 28px;
  margin-bottom: 14px;
  display: block;
}
.feature-title {
  font-family: 'Cormorant Garamond', serif;

/* ─── CONTACT ─── */
.contact-section {
  background: var(--ink);
  padding: 100px 80px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
.contact-left .section-label { color: rgba(184,154,106,0.8); }
.contact-left .section-title { color: var(--cream); }
.contact-left .section-title em { color: var(--gold); }
.contact-info { margin-top: 40px; display: flex; flex-direction: column; gap: 20px; }
.contact-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.contact-icon {
  width: 36px;
  height: 36px;
  border: 1px solid rgba(184,154,106,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.contact-text { font-size: 13px; color: rgba(245,243,238,0.65); line-height: 1.7; font-weight: 300; }
.contact-text strong { color: var(--cream); font-weight: 400; display: block; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 2px; }
.contact-right { display: flex; flex-direction: column; gap: 16px; }
.input-group { display: flex; flex-direction: column; gap: 8px; }
