<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapada Luxe</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  padding: 15px;
  background: black;
  color: white;
  display: flex;
  justify-content: space-between;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  padding: 10px;
  border-radius: 10px;
}

button {
  padding: 8px;
  margin: 3px;
  cursor: pointer;
}

.cart {
  position: fixed;
  right: 0;
  top: 0;
  width: 300px;
  height: 100%;
  background: white;
  padding: 10px;
  overflow-y: auto;
  border-left: 2px solid #ddd;
}
</style>
</head>

<body>

<header>
  <h3>Kapada Luxe</h3>
  <div>
    ❤️ <span id="wishCount">0</span> |
    🛒 <span id="cartCount">0</span>
  </div>
</header>

<!-- TRUST -->
<div style="padding:10px;text-align:center;">
  Free Delivery • 7 Days Return • Premium Quality
</div>

<!-- PRODUCTS -->
<div class="grid" id="products"></div>

<!-- CART -->
<div class="cart">
  <h3>Cart</h3>
  <div id="cartItems"></div>
  <h4>Total: Rs <span id="total">0</span></h4>

  <button onclick="whatsappOrder()">Order via WhatsApp</button>
  <button onclick="buyNow()">Buy Now</button>
  <button onclick="esewaPay()">Pay with eSewa</button>
</div>

<script>

let products = [
  {id:1,name:"Shirt",price:1000},
  {id:2,name:"Pant",price:1500},
  {id:3,name:"Jacket",price:2500}
];

let cart = [];
let wishlist = [];

function renderProducts(){
  let html="";
  products.forEach(p=>{
    html+=`
    <div class="card">
      <h4>${p.name}</h4>
      <p>Rs ${p.price}</p>

      <button onclick="addToCart(${p.id})">Add to Cart</button>
      <button onclick="addWishlist(${p.id})">❤️</button>
    </div>`;
  });
  document.getElementById("products").innerHTML=html;
}

function addToCart(id){
  let item = cart.find(x=>x.id===id);
  if(item){
    item.qty++;
  } else {
    let p = products.find(x=>x.id===id);
    cart.push({...p, qty:1});
  }
  updateCart();
}

function updateCart(){
  let html="";
  let total=0;
  cart.forEach(i=>{
    total += i.price*i.qty;
    html+=`
    <div>
      ${i.name} 
      <button onclick="changeQty(${i.id},-1)">-</button>
      ${i.qty}
      <button onclick="changeQty(${i.id},1)">+</button>
      Rs ${i.price*i.qty}
    </div>`;
  });

  document.getElementById("cartItems").innerHTML=html;
  document.getElementById("total").innerText=total;
  document.getElementById("cartCount").innerText=cart.length;
}

function changeQty(id,change){
  let item = cart.find(x=>x.id===id);
  item.qty += change;
  if(item.qty<=0){
    cart = cart.filter(x=>x.id!==id);
  }
  updateCart();
}

function addWishlist(id){
  if(!wishlist.includes(id)){
    wishlist.push(id);
  }
  document.getElementById("wishCount").innerText=wishlist.length;
}

function whatsappOrder(){
  let msg="Order:\n";
  cart.forEach(i=>{
    msg += `${i.name} x${i.qty} = Rs ${i.price*i.qty}\n`;
  });

  window.open("https://wa.me/977XXXXXXXXXX?text="+encodeURIComponent(msg));
}

function buyNow(){
  alert("Order placed!");
}

function esewaPay(){
  alert("eSewa payment demo (integration later)");
}

renderProducts();

</script>

</body>
</html>
